name: VytalProtect
version: 1.0.0-SNAPSHOT
main: lat.vytalprotect.VytalProtectPlugin
author: Vytal
description: Sistema de protecciones por bloques con menús y hologramas propios.
commands:
  vytalprotect:
    description: Comando principal de VytalProtect
    aliases: [vp]
    usage: /vp
permissions:
  vytalprotect.admin:
    description: Administración completa de VytalProtect
    default: op
  vytalprotect.give:
    description: Permite entregar bloques de protección
    default: op
    
