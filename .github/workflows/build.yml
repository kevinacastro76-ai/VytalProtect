name: Build VytalProtect

on:
push:
branches: [ "" ]
pull_request:
branches: [ "" ]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Compile VytalProtect
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 8
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "8"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Validate Gradle wrapper
    id: wrapper
    run: |
      if [ ! -f "./gradlew" ]; then
        echo "Gradle wrapper not found. Generate and commit gradlew and gradle/wrapper files."
        exit 1
      fi
      chmod +x ./gradlew

  - name: Build plugin
    run: ./gradlew clean build

  - name: Upload plugin JAR
    uses: actions/upload-artifact@v4
    with:
      name: VytalProtect
      path: build/libs/*.jar
      if-no-files-found: error
