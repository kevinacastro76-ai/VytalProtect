
name: Build VytalProtect

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build with Gradle
        run: gradle build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VytalProtect-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          
